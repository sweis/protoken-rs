[package]
name = "protoken-python"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Python bindings for protoken"
publish = false

# Built by maturin (see pyproject.toml), which installs this as the
# `protoken._protoken` extension module.
[lib]
name = "_protoken"
crate-type = ["cdylib"]

[dependencies]
protoken = { path = "../..", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
