name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      # The library must build for users who disable the CLI.
      - run: cargo check --no-default-features
      # Stored vectors must be reproducible from the generators.
      - run: cargo run --example gen_test_vectors | diff - testdata/vectors.json
      - run: cargo run --example gen_reference_vectors | diff - testdata/reference_vectors.json

  lint:
    name: Clippy and rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --lib -- -D warnings
      - run: cargo check --manifest-path fuzz/Cargo.toml

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit
      - run: cargo audit

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pip builds the extension with maturin as the PEP 517 backend.
      - run: pip install pytest ./bindings/python
      - run: pytest
        working-directory: bindings/python
