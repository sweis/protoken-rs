[workspace]
members = ["bindings/python"]
# The fuzz crate is a standalone cargo-fuzz project with its own lockfile.
exclude = ["fuzz"]

[package]
name = "protoken"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Protobuf-based signed tokens: a minimal, fast alternative to JWTs"
repository = "https://github.com/sweis/protoken-rs"
readme = "README.md"
categories = ["authentication", "cryptography", "encoding"]
keywords = ["token", "jwt", "protobuf", "ml-dsa", "slh-dsa"]

[features]
default = ["cli"]
# Dependencies used only by the `protoken` binary. Library users can disable
# them with `default-features = false`.
cli = ["dep:clap", "dep:colored", "dep:humantime", "dep:serde_json"]

[[bin]]
name = "protoken"
required-features = ["cli"]

[dependencies]
# Crypto
hmac = { version = "0.13", features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
subtle = "2"
ml-dsa = { version = "0.1", default-features = false, features = ["alloc", "zeroize"] }
# Pinned: neither release promises compatibility, and fn-dsa will change its
# key and signature formats to follow FIPS 206 drafts.
fn-dsa = "=0.4.0"
fn-dsa-comm = "=0.4.0"
fn-dsa-kgen = "=0.4.0"
fn-dsa-vrfy = "=0.4.0"
# The AVX2 key decoder skips its range check and accepts corrupted keys, which
# then take many seconds to fail signing. See notes/research-fn-dsa.md.
fn-dsa-sign = { version = "=0.4.0", features = ["no_avx2"] }
slh-dsa = { version = "=0.2.0-rc.5", features = ["zeroize"] }
getrandom = "0.4"
zeroize = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
thiserror = "2"

# CLI (optional, see the `cli` feature)
clap = { version = "4", features = ["derive"], optional = true }
colored = { version = "3", optional = true }
humantime = { version = "2", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
hex = "0.4"
serde_json = "1"

[[bench]]
name = "protoken_bench"
harness = false

# An unoptimized SLH-DSA signature takes about 30 seconds. Debug assertions and
# overflow checks stay on.
[profile.dev]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
