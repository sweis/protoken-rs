[package]
name = "protoken-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
base64 = "0.22"
libfuzzer-sys = "0.4"
protoken = { path = "..", default-features = false }
serde_json = "1"

[[bin]]
name = "parse_claims"
path = "fuzz_targets/parse_claims.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_signed_token"
path = "fuzz_targets/parse_signed_token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_keys"
path = "fuzz_targets/parse_keys.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exercise_token"
path = "fuzz_targets/exercise_token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_token"
path = "fuzz_targets/verify_token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_untrusted_key"
path = "fuzz_targets/verify_untrusted_key.rs"
test = false
doc = false
bench = false
